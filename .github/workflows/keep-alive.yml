name: Render Keep-Alive Ping

on:
  schedule:
    # Ping every 10 minutes to prevent Render free-tier idle spin down (15 min timeout)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Instances
    runs-on: ubuntu-latest
    steps:
      - name: Ping Wind Forecast Backend Health
        run: |
          curl -s -f -m 60 https://wind-forecast-backend-yb3v.onrender.com/health || true

      - name: Ping Wind Forecast Frontend
        run: |
          curl -s -f -m 60 https://wind-forecast-frontend.onrender.com/health || true
